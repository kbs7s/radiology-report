<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6e69">
  <title>تقارير الأشعة</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d6e69'/%3E%3Cpath d='M9 13v-2a2 2 0 0 1 2-2h2M19 9h2a2 2 0 0 1 2 2v2M23 19v2a2 2 0 0 1-2 2h-2M13 23h-2a2 2 0 0 1-2-2v-2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <style id="page-css"></style>
</head>
<body>
  <!-- Visible error banner: surfaces any load/runtime error so a blank page never hides the cause -->
  <div id="fatal" style="display:none;position:fixed;inset:0;z-index:9999;background:#2a0d0d;color:#ffd7d7;
    font:14px/1.6 monospace;padding:24px;overflow:auto;direction:ltr;white-space:pre-wrap"></div>
  <script>
    (function () {
      var box = document.getElementById("fatal");
      function show(msg) {
        box.style.display = "block";
        box.textContent = "حدث خطأ — صوّر هذه الشاشة وأرسلها:\n\n" + msg +
          "\n\nإذا تقدر، افتح Console بالمتصفح وصوّر الرسالة الحمراء.";
      }
      window.addEventListener("error", function (e) {
        // Errors from extensions or cross-origin scripts carry no detail and are not ours
        if (!e.filename || e.filename.indexOf(location.origin) !== 0) return;
        show((e.message || "error") + "\n" + e.filename + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        show("Unhandled: " + (r && (r.stack || r.message || r.code) || r));
      });
    })();
  </script>

  <div id="root"><div class="boot">جارٍ التحميل…</div></div>

  <input type="file" id="image-file" accept="image/*" hidden>
  <input type="file" id="library-files" accept=".json,application/json" multiple hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
